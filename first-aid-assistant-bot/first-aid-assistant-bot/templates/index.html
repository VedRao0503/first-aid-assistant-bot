<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Aid Assistant - Medical Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        /* Desktop Container */
        .app-container {
            width: 100%; max-width: 1100px; height: 88vh; background: #1e293b;
            border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            display: grid; grid-template-columns: 300px 1fr; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Sidebar (Desktop) */
        .sidebar {
            background: #0f172a; padding: 24px; border-right: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .brand h1 { color: #f8fafc; font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .status-badge { color: #10b981; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-top: 6px; }
        .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .quick-section { margin-top: 24px; }
        .quick-section h3 { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .side-chips { display: flex; flex-direction: column; gap: 8px; }
        .side-chip {
            background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 14px;
            border-radius: 10px; font-size: 0.85rem; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.2s;
        }
        .side-chip:hover { background: #ef4444; color: white; border-color: #ef4444; }

        .emergency-banner {
            background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; padding: 16px; border-radius: 12px;
            text-align: center;
        }
        .call-btn {
            background: #ef4444; color: white; text-decoration: none; font-weight: 700; font-size: 0.9rem;
            padding: 10px; border-radius: 8px; display: block; margin-top: 8px; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        /* Main Chat Area */
        .chat-area { display: flex; flex-direction: column; height: 100%; background: #0f172a; }
        .chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }

        .msg-row { display: flex; flex-direction: column; max-width: 80%; animation: fadeIn 0.2s ease-out; }
        .msg-row.user { align-self: flex-end; }
        .msg-row.bot { align-self: flex-start; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .msg-bubble { padding: 14px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; }
        .user .msg-bubble { background: #2563eb; color: white; border-bottom-right-radius: 4px; }
        .bot .msg-bubble { background: #1e293b; border: 1px solid rgba(255,255,255,0.08); border-bottom-left-radius: 4px; }

        .protocol-card { background: rgba(239, 68, 68, 0.12); border-left: 4px solid #ef4444; padding: 14px; border-radius: 8px; margin-top: 6px; }
        .protocol-title { font-weight: 700; color: #fca5a5; font-size: 1rem; margin-bottom: 10px; text-transform: uppercase; }
        .protocol-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
        .protocol-list li { font-size: 0.92rem; color: #f1f5f9; display: flex; gap: 10px; }
        .protocol-list li span { color: #f87171; font-weight: 700; }

        .input-area { padding: 18px 24px; background: #1e293b; display: flex; gap: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
        .input-area input {
            flex: 1; background: #0f172a; border: 1px solid #334155; color: white; padding: 14px 18px;
            border-radius: 12px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #3b82f6; }
        .send-btn {
            background: #2563eb; color: white; border: none; width: 48px; height: 48px; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: background 0.2s;
        }

        .typing-indicator { display: flex; gap: 5px; padding: 6px 10px; }
        .typing-dot { width: 6px; height: 6px; background: #64748b; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Responsive Mobile Adjustments */
        @media (max-width: 768px) {
            body { padding: 0; }
            .app-container { grid-template-columns: 1fr; height: 100vh; border-radius: 0; border: none; }
            .sidebar { display: none; }
            .msg-row { max-width: 90%; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Sidebar for Desktop -->
    <div class="sidebar">
        <div>
            <div class="brand">
                <h1>🚑 First-Aid Bot</h1>
                <div class="status-badge"><div class="pulse-dot"></div> System Active (24/7)</div>
            </div>

            <div class="quick-section">
                <h3>Emergency Presets</h3>
                <div class="side-chips">
                    <button class="side-chip" onclick="sendQuickMsg('CPR')">🫀 CPR Protocol</button>
                    <button class="side-chip" onclick="sendQuickMsg('Choking')">🥩 Choking Aid</button>
                    <button class="side-chip" onclick="sendQuickMsg('Severe Bleeding')">🩸 Bleeding Control</button>
                    <button class="side-chip" onclick="sendQuickMsg('Snake Bite')">🐍 Snake Bite First-Aid</button>
                    <button class="side-chip" onclick="sendQuickMsg('Burns')">🔥 Burn Care</button>
                    <button class="side-chip" onclick="sendQuickMsg('Stroke')">🧠 Stroke Assessment</button>
                </div>
            </div>
        </div>

        <div class="emergency-banner">
            <span style="color:#f87171; font-size:0.8rem; font-weight:600;">CRITICAL EMERGENCY?</span>
            <a href="tel:108" class="call-btn">📞 CALL 108 NOW</a>
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-area">
        <div class="chat-box" id="chatBox">
            <div class="msg-row bot">
                <div class="msg-bubble">
                    <strong>Medical Emergency Triage Active.</strong><br>
                    State the medical condition clearly (e.g., "someone is choking", "needs CPR", "burns") or select a quick option from the sidebar.
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type medical emergency here..." onkeypress="if(event.key === 'Enter') handleSend()">
            <button class="send-btn" onclick="handleSend()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    function appendUserMessage(text) {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTypingIndicator() {
        const row = document.createElement('div');
        row.className = 'msg-row bot';
        row.id = 'typingIndicator';
        row.innerHTML = `<div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTypingIndicator() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function appendBotResponse(data) {
        removeTypingIndicator();
        const row = document.createElement('div');
        row.className = 'msg-row bot';

        let htmlContent = '';
        if (data.type === 'protocol') {
            let stepsHtml = data.steps.map((step, idx) => `<li><span>${idx + 1}.</span> ${step}</li>`).join('');
            htmlContent = `
                <div class="msg-bubble">
                    <div class="protocol-card">
                        <div class="protocol-title">🚨 ${data.title}</div>
                        <ul class="protocol-list">${stepsHtml}</ul>
                    </div>
                </div>`;
        } else {
            htmlContent = `<div class="msg-bubble">${data.message}</div>`;
        }

        row.innerHTML = htmlContent;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        appendUserMessage(text);
        userInput.value = '';
        showTypingIndicator();

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            setTimeout(() => appendBotResponse(data), 200);
        } catch (err) {
            removeTypingIndicator();
            appendBotResponse({
                type: 'error',
                message: '<strong>Connection Error.</strong> If this is an emergency, Call 108 directly!'
            });
        }
    }

    function sendQuickMsg(text) {
        userInput.value = text;
        handleSend();
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
